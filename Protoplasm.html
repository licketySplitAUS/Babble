<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a14">
<title>Protoplasm</title>
<style>
  :root{--bg:#0b0a14;--ink:#e9e4f5}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0a14;--ink:#e9e4f5}}
  :root[data-theme="dark"]{--bg:#0b0a14;--ink:#e9e4f5}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const cv=document.getElementById('c');
const gl=cv.getContext('webgl',{antialias:false,alpha:false});
const VS=`attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS=`
precision highp float;
uniform vec2 R,O,D;
uniform float T,E,V,H,P,A;
uniform vec4 B[3];
uniform vec4 S[3];
uniform vec4 W[12];
float h(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;mat2 m=mat2(.8,-.6,.6,.8);
  for(int i=0;i<4;i++){s+=a*n(p);p=m*p*2.03+7.1;a*=.5;}return s;}
vec3 hsv(vec3 c){vec4 K=vec4(1.,2./3.,1./3.,3.);vec3 p=abs(fract(c.xxx+K.xyz)*6.-K.www);
  return c.z*mix(K.xxx,clamp(p-K.xxx,0.,1.),c.y);}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
  vec2 lp=uv*1.25, p=lp+O;               // lp: local coords (waves), p: travelling coords (noise)
  vec2 q=vec2(fbm(p+vec2(0.,T*.03)),fbm(p+vec2(5.2,1.3)-T*.025));
  vec2 dp=vec2(-D.y,D.x);
  float al=dot(lp,D)-P, ac=dot(lp,dp);   // phase P travels the ripples, so turning never whips them
  float w =sin(al*2.0-T*.12+3.*fbm(p*.7+q*2.))*.5+.5;
  float w2=sin(al*1.0+ac*.55-T*.08+q.x*4.)*.5+.5;
  vec2 pp=p+(q-.5)*1.9+D*(w-.5)*(.35+E*.9+A*.8);
  float r=fbm(pp*.8+q*1.5);
  float hue=H+r*.42+w2*.14+(w-.5)*(.07+E*.2+A*.15);
  float sat=.52+.22*r-.05*w2;
  float val=.40+.42*r+.12*w;
  for(int i=0;i<3;i++){
    vec2 d=uv-B[i].xy+(q-.5)*.3;
    float a=atan(d.y,d.x), vt=S[i].w;
    float amp=(.12+.3*V)*(1.+(1.-vt)*.9);
    float def=1.+amp*sin(a*3.+S[i].x+T*.22)+amp*.65*sin(a*2.+S[i].y-T*.17)+amp*.35*sin(a*5.+S[i].z+T*.28);
    float m=exp(-pow(length(d)/(def*max(B[i].z,.001)),2.)*1.4)*vt;
    hue+=m*B[i].w; val+=m*.26; sat-=m*.12;
  }
  float warm=0.,cool=0.;
  for(int i=0;i<12;i++){
    vec2 d=uv-W[i].xy+(q-.5)*.22;
    float m=exp(-pow(length(d)/max(W[i].z,.001),2.)*1.2)*abs(W[i].w);
    if(W[i].w>0.) warm+=m; else cool+=m;
  }
  warm=clamp(warm,0.,1.);cool=clamp(cool,0.,1.);
  hue+=sin(6.2832*(.035+r*.09-w2*.03-hue))*.25*warm;   // smooth pull, no hard seam
  hue+=sin(6.2832*(.56+r*.08+w2*.04-hue))*.22*cool;
  sat+=warm*.14+cool*.08; val+=warm*.12-cool*.1;
  vec3 col=hsv(vec3(hue,clamp(sat,0.,1.),clamp(val,0.,1.)));
  col+=(h(gl_FragCoord.xy)-.5)/200.;
  gl_FragColor=vec4(col,1.);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
const pg=gl.createProgram();
gl.attachShader(pg,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pg);gl.useProgram(pg);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pg,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pg,n);
const uR=U('R'),uO=U('O'),uD=U('D'),uT=U('T'),uE=U('E'),uV=U('V'),uH=U('H'),uP=U('P'),uA=U('A'),uB=U('B'),uS=U('S'),uW=U('W');
function resize(){const k=Math.min(devicePixelRatio||1,2)*.5;
  cv.width=Math.max(2,innerWidth*k|0);cv.height=Math.max(2,innerHeight*k|0);gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',resize);resize();

/* ---------- state ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a), asp0=()=>innerWidth/innerHeight;
let off=[rnd(0,50),rnd(0,50)],vel=[0,0],sv=[0,0],ang=rnd(0,6.28),energy=0,visc=.5,hue=Math.random(),phase=0;
const seeds=()=>[rnd(0,6.3),rnd(0,6.3),rnd(0,6.3)];
// each protoplasm lives, dies off slowly, rests, then regrows somewhere new. p = vitality 0..1
const blobs=[0,1,2].map(i=>{
  const b={x:rnd(-.3,.3),y:rnd(-.5,.5),r:rnd(.22,.4),hs:[.28,-.22,.45][i],s:seeds(),ts:seeds(),next:rnd(2,8),
    ph:i<2?'live':'grow',p:i<2?1:.15,dur:30,lt:i===0?rnd(15,30):rnd(30,45)};
  b.tx=b.x;b.ty=b.y;b.tr=b.r;return b;});

/* ---------- motion ---------- */
let lastO=null;
const RX=1.7;   // reaction speed: how quickly it answers motion, touch and sound
const push=(x,y)=>{vel[0]+=x*RX;vel[1]+=y*RX;};
function onMotion(e){const a=e.acceleration,r=e.rotationRate;
  if(a&&a.x!=null)push(a.x*.012,a.y*.012);
  if(r&&r.alpha!=null)push(r.gamma*.0009,-r.beta*.0009);}
function onOrient(e){if(e.beta==null)return;
  if(lastO){const dg=e.gamma-lastO[0],db=e.beta-lastO[1];if(Math.abs(dg)<30&&Math.abs(db)<30)push(dg*.006,-db*.006);}
  lastO=[e.gamma,e.beta];}

/* ---------- microphone ---------- */
let an=null,fd=null,lvl=0,bass=0,treb=0,pk=[.03,.05,.03];
async function startMic(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    ac.resume();
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    an=ac.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.85;
    ac.createMediaStreamSource(st).connect(an);fd=new Uint8Array(an.frequencyBinCount);
    ac.resume();
  }catch(_){}
}
const ease=(c,t,dt)=>c+(t-c)*Math.min(1,dt*RX*(t>c?1.6:.5));
function listen(dt){
  let tl=0,tb=0,th=0;
  if(an){
    an.getByteFrequencyData(fd);
    const avg=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=fd[i];return s/(b-a)/255;};
    const v=[avg(1,120),avg(1,4),avg(24,120)];
    for(let i=0;i<3;i++)pk[i]=Math.max(v[i],pk[i]*(1-dt*.04),.02); // adapts, so quiet rooms still register
    tl=Math.min(1,v[0]/pk[0]);tb=Math.min(1,v[1]/pk[1]);th=Math.min(1,v[2]/pk[2]);
  }
  lvl=ease(lvl,tl,dt);bass=ease(bass,tb,dt);treb=ease(treb,th,dt);
}

/* ---------- touch ---------- */
const warms=[],touches=new Map();
const toUV=(x,y)=>[(x-innerWidth/2)/innerHeight,-(y-innerHeight/2)/innerHeight];
function deposit(t){
  if(warms.length>=12)return;   // never drop one abruptly; wait for an old one to dissolve
  const w={x:t.sx,y:t.sy,r:.16,s:0,max:t.max,sign:t.sign,held:true};
  warms.push(w);t.w=w;t.lx=t.sx;t.ly=t.sy;
}
cv.addEventListener('pointerdown',e=>{
  const [x,y]=toUV(e.clientX,e.clientY),k=Math.random();
  let kind=k<.4?0:k<.7?1:2,blob=null;
  if(kind===2){let bd=1e9;blobs.forEach(b=>{const d=Math.hypot(b.x-x,b.y-y);if(b.p>.3&&d<bd){bd=d;blob=b;}});if(!blob)kind=0;}
  const t={px:e.clientX,py:e.clientY,sx:x,sy:y,sign:kind===1?-1:1,max:kind===2?.12:rnd(.3,.5),blob};
  touches.set(e.pointerId,t);deposit(t);
});
addEventListener('pointermove',e=>{const t=touches.get(e.pointerId);if(!t)return;
  push((e.clientX-t.px)*.0015,-(e.clientY-t.py)*.0015);t.px=e.clientX;t.py=e.clientY;});
function lift(e){const t=touches.get(e.pointerId);if(t&&t.w)t.w.held=false;touches.delete(e.pointerId);}
addEventListener('pointerup',lift);addEventListener('pointercancel',lift);

function listenMotion(){addEventListener('devicemotion',onMotion);addEventListener('deviceorientation',onOrient);}
const needsAsk=window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function';
if(!needsAsk)listenMotion();   // Android and desktop: sensors start straight away
async function begin(){
  startMic();                  // called synchronously inside the tap so the browser will prompt
  if(needsAsk){
    const ask=[DeviceMotionEvent.requestPermission().catch(()=>{})];
    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')
      ask.push(DeviceOrientationEvent.requestPermission().catch(()=>{}));
    await Promise.all(ask);listenMotion();
  }
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen');}catch(_){}
}
addEventListener('click',begin,{once:true});

/* ---------- loop ---------- */
const bArr=new Float32Array(12),sArr=new Float32Array(12),wArr=new Float32Array(48);
let t0=performance.now(),T=rnd(0,100);
function frame(now){
  const dt=Math.min((now-t0)/1000,.05);t0=now;T+=dt;
  listen(dt);

  // current: smoothed so direction turns slowly and ripples never whip
  const sp=Math.hypot(vel[0],vel[1]);
  sv[0]+=(vel[0]-sv[0])*Math.min(1,dt*.8*RX);sv[1]+=(vel[1]-sv[1])*Math.min(1,dt*.8*RX);
  const ssp=Math.hypot(sv[0],sv[1]);
  if(ssp>.01){let d=Math.atan2(sv[1],sv[0])-ang;d=Math.atan2(Math.sin(d),Math.cos(d));ang+=d*Math.min(1,dt*.6*RX);}
  else ang+=dt*.02;
  ang+=(treb-.3)*dt*.12*Math.min(1,lvl*2);       // bright sounds slowly turn the current
  const dx=Math.cos(ang),dy=Math.sin(ang);

  off[0]+=(.012+vel[0]+dx*lvl*.05)*dt;off[1]+=(.008+vel[1]+dy*lvl*.05)*dt;
  phase+=(.02+(vel[0]*dx+vel[1]*dy)*1.5+lvl*.22+bass*.05)*dt;   // sound drives the ripples along
  vel[0]*=Math.exp(-dt*.9);vel[1]*=Math.exp(-dt*.9);
  if(sp>1.2){vel[0]*=1.2/sp;vel[1]*=1.2/sp;}
  energy+=(Math.min(1,sp*2.5)-energy)*Math.min(1,dt*.6*RX);

  visc=Math.max(.05,Math.min(1,.5+.4*Math.sin(T*.05)+.1*Math.sin(T*.13+2)-lvl*.2));  // sound loosens it
  hue=(hue+dt*(.004+energy*.01+treb*lvl*.012))%1;

  // protoplasm life cycle + wandering
  const asp=asp0();
  blobs.forEach((b,i)=>{
    if(b.ph==='live'){b.lt-=dt;
      if(b.lt<=0){if(blobs.some(o=>o!==b&&o.p>.6&&o.ph!=='die')){b.ph='die';b.dur=rnd(14,24);}else b.lt=4;}}
    else if(b.ph==='die'){b.p-=dt/b.dur;if(b.p<=0){b.p=0;b.ph='rest';b.lt=rnd(3,9);}}
    else if(b.ph==='rest'){b.lt-=dt;
      if(b.lt<=0){b.x=b.tx=rnd(-.45,.45)*asp*.9;b.y=b.ty=rnd(-.5,.5);b.tr=b.r=rnd(.2,.44);
        b.ts=seeds();b.s=b.ts.slice();b.hs=rnd(-.45,.45);b.next=rnd(7,16);b.ph='grow';b.dur=rnd(26,40);}}
    else{b.p+=dt/b.dur;if(b.p>=1){b.p=1;b.ph='live';b.lt=rnd(18,40);}}
    const vit=b.p*b.p*(3-2*b.p);
    if(b.p>.3){b.next-=dt;
      if(b.next<=0){b.next=rnd(7,16);b.tx=rnd(-.45,.45)*asp*.9;b.ty=rnd(-.55,.55);b.tr=rnd(.18,.46)*(1.1+energy*.4);b.ts=seeds();}}
    const k=dt*(.08+.35*(1-visc)+energy*.15+lvl*.1);
    b.x+=(b.tx-b.x)*k;b.y+=(b.ty-b.y)*k;b.r+=(b.tr-b.r)*k*1.2;
    for(let j=0;j<3;j++)b.s[j]+=(b.ts[j]-b.s[j])*k*.6;
    b.x+=vel[0]*dt*.25;b.y+=vel[1]*dt*.25;
    const br=b.r*(.3+.7*vit)*(1+.06*Math.sin(T*.4+i*2))*(1+bass*.14);
    bArr.set([b.x,b.y,br,b.hs],i*4);sArr.set([b.s[0],b.s[1],b.s[2],vit],i*4);
  });

  // touches glide, never snap
  touches.forEach(t=>{
    const [x,y]=toUV(t.px,t.py),k=Math.min(1,dt*3*RX);
    t.sx+=(x-t.sx)*k;t.sy+=(y-t.sy)*k;
    if(t.w){t.w.x+=(t.sx-t.w.x)*k;t.w.y+=(t.sy-t.w.y)*k;
      if(Math.hypot(t.sx-t.lx,t.sy-t.ly)>.14){t.w.held=false;deposit(t);}}
    if(t.blob&&t.blob.p>.3){const b=t.blob;
      b.tx+=(t.sx-b.tx)*dt*.12*RX;b.ty+=(t.sy-b.ty)*dt*.12*RX;
      b.tr=Math.min(.5,b.tr+dt*.03*RX);b.next=Math.max(b.next,4);
      if(b.ph==='live')b.lt=Math.max(b.lt,6);}
  });
  for(let i=warms.length-1;i>=0;i--){const w=warms[i];
    if(w.held){w.s+=(w.max-w.s)*Math.min(1,dt*.8*RX);w.r=Math.min(.34,w.r+dt*.04);}
    else{w.s*=Math.exp(-dt*.3*RX);w.r+=dt*.01;w.x+=vel[0]*dt*.35;w.y+=vel[1]*dt*.35;if(w.s<.008)warms.splice(i,1);}}
  wArr.fill(0);warms.forEach((w,i)=>wArr.set([w.x,w.y,w.r,w.s*w.sign],i*4));

  gl.uniform4fv(uW,wArr);
  gl.uniform2f(uR,cv.width,cv.height);gl.uniform2f(uO,off[0],off[1]);gl.uniform2f(uD,dx,dy);
  gl.uniform1f(uT,T);gl.uniform1f(uE,energy);gl.uniform1f(uV,visc);gl.uniform1f(uH,hue);
  gl.uniform1f(uP,phase);gl.uniform1f(uA,lvl);
  gl.uniform4fv(uB,bArr);gl.uniform4fv(uS,sArr);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
