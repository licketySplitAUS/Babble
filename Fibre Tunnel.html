<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fibre Tunnel</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:#000;overflow:hidden}
body{height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;opacity:.65;letter-spacing:.04em;transition:opacity 2.5s;pointer-events:none;text-shadow:0 0 8px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Move to steer. Scroll or use ↑ ↓ for speed. Tap or press space to pause.</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,D;
function resize(){
  D=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*D;cv.height=H*D;
  ctx.setTransform(D,0,0,D,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
}
addEventListener('resize',resize);resize();

const N=600,S=34,ZMAX=34,DZ=ZMAX/S,TAU=Math.PI*2;
const PX=new Float32Array(S*N),PY=new Float32Array(S*N),PZ=new Float32Array(S);
const B=36,L=3,NB=B*L,cnt=new Int32Array(NB+1),pos=new Int32Array(NB),bk=new Int16Array(N),ord=new Int16Array(N);
let t=0,cam=0,speed=6,target=6,paused=false,mx=0,my=0,sx=0,sy=0,last=performance.now();

// the winding spine of the tunnel
const path=(w,T)=>[
  Math.sin(w*.21+T*.35)*.9+Math.sin(w*.09-T*.21)*1.3,
  Math.cos(w*.17+T*.28)*.8+Math.sin(w*.11+T*.17)*1.1
];
const twist=(w,T)=>Math.sin(w*.12+T*.25)*1.8+w*.04;
const radius=(w,T)=>2+.6*Math.sin(w*.35+T*.8)+.3*Math.sin(w*.13-T*.4);
const hue=(i,w)=>(((t*22+w*9+i/N*140+50*Math.sin(w*.18+t*.3))%360)+360)%360;

function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(!paused){t+=dt;speed+=(target-speed)*Math.min(1,dt*2);cam+=speed*dt;}
  sx+=(mx-sx)*.05;sy+=(my-sy)*.05;

  // fade previous frame for soft light trails
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,6,.3)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  const f=Math.min(W,H)*.9,cx=W/2+sx*W*.07,cy=H/2+sy*H*.07;
  const c0=path(cam,t),e=.05,c1=path(cam+e,t);
  const dx=(c1[0]-c0[0])/e,dy=(c1[1]-c0[1])/e,tw0=twist(cam,t);
  const off=cam%DZ;

  // build rings of fibre points
  for(let k=0;k<S;k++){
    const z=.2+DZ-off+k*DZ,w=cam+z;PZ[k]=z;
    const pc=path(w,t),ox=pc[0]-c0[0]-dx*z,oy=pc[1]-c0[1]-dy*z;
    const R=radius(w,t),tw=twist(w,t)-tw0+t*.08,sc=f/z;
    for(let i=0;i<N;i++){
      const a=i/N*TAU+tw,r=R*(1+.1*Math.sin(i*12.9898+w*.7));
      PX[k*N+i]=cx+(ox+r*Math.cos(a))*sc;
      PY[k*N+i]=cy+(oy+r*Math.sin(a))*sc;
    }
  }

  // fibres
  ctx.lineCap='round';
  const lim=W*2;
  // fibres are batched by hue and shimmer level so thousands of segments stay fast
  const LV=[.45,.75,1];
  for(let k=0;k<S-1;k++){
    const z=PZ[k],w=cam+z,fade=Math.pow(Math.max(0,1-z/(ZMAX+2)),2);
    const base=.22*fade*Math.min(1,z/1.2);
    if(base<.008)continue;
    ctx.lineWidth=Math.min(4,Math.max(.4,f/z*.0048));
    const hb=t*22+w*9+50*Math.sin(w*.18+t*.3);
    cnt.fill(0);
    for(let i=0;i<N;i++){
      const a=k*N+i;
      if(Math.abs(PX[a]-cx)>lim||Math.abs(PY[a]-cy)>lim){bk[i]=-1;continue;}
      const tw=.55+.45*Math.sin(i*3.1+t*3+w*.5);
      const h=(((hb+i/N*140)%360)+360)%360;
      const b=((h/360*B)|0)*L+Math.min(L-1,((tw-.1)/.9*L)|0);
      bk[i]=b;cnt[b+1]++;
    }
    for(let b=0;b<NB;b++){cnt[b+1]+=cnt[b];pos[b]=cnt[b];}
    for(let i=0;i<N;i++)if(bk[i]>=0)ord[pos[bk[i]]++]=i;
    for(let b=0;b<NB;b++){
      const s=cnt[b],e=cnt[b+1];
      if(s===e)continue;
      const lv=b%L,hh=((b/L|0)+.5)*360/B;
      ctx.strokeStyle=`hsla(${hh|0},100%,${60+8*lv}%,${(base*LV[lv]).toFixed(3)})`;
      ctx.beginPath();
      for(let q=s;q<e;q++){const a=k*N+ord[q];ctx.moveTo(PX[a],PY[a]);ctx.lineTo(PX[a+N],PY[a+N]);}
      ctx.stroke();
    }
  }

  // light pulses racing along the fibres
  for(let j=0;j<48;j++){
    const i=(j*5)%N,v=8+(j%5)*2.2;
    const z=(((j*13.7+t*v-cam)%ZMAX)+ZMAX)%ZMAX+.3,w=cam+z;
    const pc=path(w,t),R=radius(w,t)*(1+.1*Math.sin(i*12.9898+w*.7));
    const a=i/N*TAU+twist(w,t)-tw0+t*.08,sc=f/z;
    const px=cx+(pc[0]-c0[0]-dx*z+R*Math.cos(a))*sc,py=cy+(pc[1]-c0[1]-dy*z+R*Math.sin(a))*sc;
    const al=Math.pow(1-z/(ZMAX+2),1.5)*Math.min(1,z/2),h=hue(i,w)|0,s=Math.max(1.5,sc*.03);
    ctx.fillStyle=`hsla(${h},100%,65%,${(al*.25).toFixed(3)})`;
    ctx.beginPath();ctx.arc(px,py,s*3.5,0,TAU);ctx.fill();
    ctx.fillStyle=`hsla(${h},60%,92%,${(al*.9).toFixed(3)})`;
    ctx.beginPath();ctx.arc(px,py,s,0,TAU);ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// interaction
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1;});
addEventListener('wheel',e=>{target=Math.min(24,Math.max(1,target-e.deltaY*.01));},{passive:true});
addEventListener('keydown',e=>{
  if(e.key==='ArrowUp')target=Math.min(24,target+1.5);
  else if(e.key==='ArrowDown')target=Math.max(1,target-1.5);
  else if(e.code==='Space'){paused=!paused;e.preventDefault();}
});
addEventListener('click',()=>{paused=!paused;});
setTimeout(()=>{document.getElementById('hint').style.opacity=0;},7000);
})();
</script>
</body>
</html>
