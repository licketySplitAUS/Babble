<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Pacifico&family=Righteous&family=Lobster&family=Permanent+Marker&family=Rubik+Mono+One&family=Fascinate&family=Abril+Fatface&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#07031a;overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hint{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;transition:opacity 1.2s;padding:20px}
#hint h1{font-family:Bungee,Impact,sans-serif;font-size:clamp(48px,16vw,120px);margin:0;background:linear-gradient(90deg,#ff2d95,#ffe600,#00f5d4,#7b2ff7,#ff2d95);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
#hint p{font-family:Pacifico,cursive;font-size:clamp(18px,5vw,30px);margin:8px 0 0;opacity:.85}
@keyframes flow{to{background-position:300% 0}}
#live{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;font-size:15px;opacity:.8;padding:0 70px;min-height:20px;pointer-events:none;text-shadow:0 0 8px #000}
#side{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:10px;z-index:3}
#side button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(20,10,40,.55);color:#fff;font-size:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:3}
#mic{font-size:18px;font-weight:700;color:#fff;border:0;border-radius:40px;padding:16px 30px;background:linear-gradient(90deg,#ff2d95,#7b2ff7,#00c2ff);background-size:200% 100%;box-shadow:0 0 28px rgba(255,45,149,.55);animation:flow2 4s linear infinite}
#mic.on{background:linear-gradient(90deg,#ff3b3b,#ff9d00,#ff2d95);box-shadow:0 0 0 0 rgba(255,60,90,.7);animation:pulse 1.2s infinite}
@keyframes flow2{to{background-position:200% 0}}
@keyframes pulse{70%{box-shadow:0 0 0 24px rgba(255,60,90,0)}100%{box-shadow:0 0 0 0 rgba(255,60,90,0)}}
#txt{width:min(80vw,380px);padding:12px 16px;font-size:16px;border-radius:30px;border:1px solid rgba(255,255,255,.35);background:rgba(20,10,40,.65);color:#fff;outline:none;text-align:center}
</style>
<link rel="icon" href="https://selfserve.r46.me/favicon.ico" type="image/x-icon"><link rel="icon" href="https://selfserve.r46.me/babble-expert-favicon.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="https://selfserve.r46.me/apple-touch-icon.png" sizes="180x180">
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><h1>SPEAK</h1><p>and watch your words multiply, drop &amp; bounce</p></div>
<div id="live"></div>
<div id="side">
  <button id="bMode" title="Motion style">✦</button>
  <button id="bKey" title="Type words">⌨</button>
  <button id="bSave" title="Save image">⤓</button>
  <button id="bClear" title="Clear">✕</button>
</div>
<div id="bar">
  <input id="txt" placeholder="type a word, press Enter" hidden autocomplete="off">
  <button id="mic">🎙 Tap to speak</button>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],sign=()=>Math.random()<.5?-1:1;
let W,H,dpr;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const FONTS=[['Bungee','sans-serif',''],['Pacifico','cursive',''],['Righteous','sans-serif',''],['Lobster','cursive',''],['Permanent Marker','cursive',''],['Rubik Mono One','sans-serif',''],['Fascinate','cursive',''],['Abril Fatface','serif',''],['Georgia','serif','italic bold'],['Impact','sans-serif',''],['Courier New','monospace','bold']];
if(document.fonts)FONTS.forEach(f=>document.fonts.load('40px "'+f[0]+'"').catch(()=>{}));

const BEH=['drop','bounce','pulse'],STYLES=['Mix','Drop & bounce','Ping-pong','Shrink & grow'];
let style=0,parts=[],hueCur=R(0,360),MAX=48;

function spawn(text,o={}){
  while(parts.length>=MAX)parts.shift();
  const F=pick(FONTS);
  let size=Math.max(22,o.size||R(.75,1)*Math.min(W,H)*(o.big?.2:.11));
  ctx.font=F[2]+' '+size+'px "'+F[0]+'",'+F[1];
  let w=ctx.measureText(text).width;
  if(w>W*.9){size*=W*.9/w;w=W*.9}
  const b=o.b||(style?BEH[style-1]:pick(['drop','drop','bounce','pulse']));
  const hh=size/2,top=hh+55,bot=Math.max(top,H-100-hh);
  const p={t:text,f:F,b,size,w,age:0,life:R(480,760),hue:o.hue!==undefined?o.hue:R(0,360),
    x:o.x!==undefined?o.x:R(Math.min(w/2+8,W/2),Math.max(W-w/2-8,W/2)),
    y:o.y!==undefined?o.y:(b==='drop'?-size:R(top,bot)),
    vx:o.vx!==undefined?o.vx:R(-2.5,2.5),vy:o.vy!==undefined?o.vy:0,
    sq:0,tilt:R(-.1,.1),ph:R(0,6.28),e:R(.55,.78),rest:false,
    floor:R(top+(bot-top)*.3,bot)};
  if(b==='drop'&&o.y!==undefined)p.floor=Math.max(p.floor,Math.min(bot,o.y+hh+30));
  if(b==='bounce'){if(o.vx===undefined||Math.abs(p.vx)>4)p.vx=sign()*R(1.5,3.5);p.vy=o.vy!==undefined&&Math.abs(o.vy)<4?o.vy:sign()*R(1.5,3.5)}
  if(b==='pulse'){p.vx=R(-.4,.4);p.vy=R(-.3,.3)}
  parts.push(p);return p;
}

function update(p,dt){
  p.age+=dt;
  const hw=Math.min(p.w/2,W/2),hh=p.size/2,top=hh+55,bot=Math.max(top,H-100-hh);
  if(p.b==='drop'){
    p.vy+=.55*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.y>=p.floor){p.y=p.floor;if(Math.abs(p.vy)>2){p.sq=Math.min(.38,Math.abs(p.vy)/38);p.vy*=-p.e}else{p.vy=0;p.rest=true}p.vx*=.9}
    if(p.rest&&Math.random()<.006*dt){p.vy=-R(7,13);p.vx=R(-2,2);p.rest=false}
    if(p.x<hw){p.x=hw;p.vx=Math.abs(p.vx)}if(p.x>W-hw){p.x=W-hw;p.vx=-Math.abs(p.vx)}
  }else if(p.b==='bounce'){
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.x<hw){p.x=hw;p.vx=Math.abs(p.vx);p.sq=.2}if(p.x>W-hw){p.x=W-hw;p.vx=-Math.abs(p.vx);p.sq=.2}
    if(p.y<top){p.y=top;p.vy=Math.abs(p.vy);p.sq=.2}if(p.y>bot){p.y=bot;p.vy=-Math.abs(p.vy);p.sq=.2}
  }else{
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.x<hw||p.x>W-hw)p.vx*=-1;if(p.y<top||p.y>bot)p.vy*=-1;
  }
  p.sq*=Math.pow(.9,dt);
  return p.age>=p.life;
}

function draw(p){
  const t=Math.min(1,p.age/40),c4=2*Math.PI/3;
  const pop=t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*c4)+1;
  const remain=p.life-p.age,ex=remain<30?Math.max(0,remain/30):1;
  const amp=p.b==='pulse'?.32:.09,br=1+amp*Math.sin(p.age*.06+p.ph);
  const sc=Math.max(0,pop*ex*br);
  const h=(p.hue+p.age*.3)%360,c1='hsl('+h+',100%,64%)',c2='hsl('+((h+70)%360)+',100%,62%)';
  ctx.save();
  ctx.globalAlpha=ex;
  ctx.translate(p.x,p.y);
  ctx.rotate(p.tilt+Math.max(-.15,Math.min(.15,p.vx*.015)));
  ctx.scale(sc*(1+p.sq),sc*(1-p.sq));
  ctx.font=p.f[2]+' '+p.size+'px "'+p.f[0]+'",'+p.f[1];
  ctx.lineJoin='round';ctx.lineWidth=Math.max(3,p.size/7);ctx.strokeStyle='rgba(8,4,24,.85)';
  ctx.strokeText(p.t,0,0);
  const g=ctx.createLinearGradient(-p.w/2,0,p.w/2,0);g.addColorStop(0,c1);g.addColorStop(1,c2);
  ctx.shadowColor=c1;ctx.shadowBlur=14;ctx.fillStyle=g;ctx.fillText(p.t,0,0);
  ctx.restore();
}

function bg(t){
  ctx.globalAlpha=1;ctx.fillStyle='#07031a';ctx.fillRect(0,0,W,H);
  const r=Math.max(W,H)*.55;
  for(let i=0;i<4;i++){
    const x=W*(.5+.4*Math.sin(t*.00017*(i+1)+i*2)),y=H*(.5+.4*Math.cos(t*.00013*(i+2)+i)),h=(t*.01+i*90)%360;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'hsla('+h+',90%,50%,.28)');g.addColorStop(1,'hsla('+h+',90%,50%,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
}

let last=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(3,(t-last)/16.667||1);last=t;
  bg(t);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=parts.length-1;i>=0;i--)if(update(parts[i],dt))parts.splice(i,1);
  for(const p of parts)draw(p);
}
requestAnimationFrame(frame);

function burst(word){
  const w=word.replace(/[^\p{L}\p{N}'’-]/gu,'');
  if(!w)return;
  hueCur=(hueCur+R(40,110))%360;
  const main=spawn(w,{big:1,hue:hueCur});
  const n=2+(Math.random()*3|0);
  for(let i=1;i<=n;i++)setTimeout(()=>{
    const b=style?BEH[style-1]:pick(['drop','drop','bounce']);
    const o={size:main.size*R(.4,.7),x:main.x,y:main.y,hue:hueCur+R(-50,50),b};
    if(b==='bounce'){o.vx=sign()*R(1.5,3.5);o.vy=sign()*R(1.5,3.5)}
    else if(b==='drop'){o.vx=R(-7,7);o.vy=-R(4,12)}
    spawn(Math.random()<.2?w.toUpperCase():w,o);
  },i*130+120);
  $('hint').style.opacity=0;
}

/* ---------- speech ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,listening=false,seen={},wake=null,liveT;
function say(t,ms){const el=$('live');el.textContent=t;clearTimeout(liveT);if(ms)liveT=setTimeout(()=>el.textContent='',ms)}

function startRec(){
  rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang=navigator.language||'en-AU';seen={};
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript.trim(),ws=t.split(/\s+/).filter(Boolean),n=seen[i]||0;
      if(ws.length>n){ws.slice(n).forEach((w,j)=>setTimeout(()=>burst(w),j*140));seen[i]=ws.length}
      say(ws.slice(-6).join(' '),4000);
    }
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      stop();say('Microphone blocked — allow it in your browser settings, or open this page directly (not in a preview) and try again.',9000);
    }
  };
  rec.onend=()=>{seen={};if(listening)setTimeout(()=>{try{startRec()}catch(_){}},250)};
  try{rec.start()}catch(_){}
}
async function start(){
  if(!SR){
    say('Speech recognition isn\'t supported here — try Chrome (Android) or Safari (iPhone). You can type words instead.',8000);
    $('txt').hidden=false;return;
  }
  listening=true;$('mic').classList.add('on');$('mic').textContent='⏹ Listening… tap to stop';
  startRec();
  try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(_){}
}
function stop(){
  listening=false;try{rec&&rec.stop()}catch(_){}
  $('mic').classList.remove('on');$('mic').textContent='🎙 Tap to speak';
  try{wake&&wake.release()}catch(_){}
}
$('mic').onclick=()=>listening?stop():start();
document.addEventListener('visibilitychange',async()=>{
  if(!document.hidden&&listening){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(_){}}
});

/* ---------- controls ---------- */
$('bMode').onclick=()=>{style=(style+1)%STYLES.length;say('Motion: '+STYLES[style],1800)};
$('bClear').onclick=()=>{parts=[]};
$('bSave').onclick=()=>{try{const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='voice-art.png';a.click()}catch(_){say('Could not save image',2000)}};
$('bKey').onclick=()=>{const t=$('txt');t.hidden=!t.hidden;if(!t.hidden)t.focus()};
$('txt').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.target.value.trim().split(/\s+/).forEach((w,j)=>setTimeout(()=>burst(w),j*140));e.target.value=''}
});
</script>
</body>
</html>
